name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked --all-extras
      # Offline: the suite blocks outbound network in every test. No secret is
      # passed, so no live model call can run here (AGENTS.md).
      - run: uv run --locked --all-extras pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The VS Code client's tests, with `vscode` stubbed: no VS Code runs here.
      - run: npm ci
      - run: npm test
